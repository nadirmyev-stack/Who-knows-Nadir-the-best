<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nadir Quiz — Host</title><link rel="stylesheet" href="/style.css"></head>
<body>
<main class="screen active"><div class="final-card" style="max-width:1100px">
<div class="eyebrow">HOST PANEL</div><h1>NADİR <span>QUIZ</span></h1>
<p id="status">İştirakçıların qoşulması gözlənilir.</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:start">
<div><img id="qr" src="/qr" style="width:100%;max-width:360px;background:white;padding:12px"><p id="url" style="word-break:break-all;font-weight:700"></p></div>
<div><button id="start">QUIZƏ BAŞLA →</button> <button id="reset" style="background:#222">RESET</button><div id="board" class="board" style="margin-top:24px"></div></div>
</div></div></main>
<script>
let ws; const $=id=>document.getElementById(id);
ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
ws.onopen=()=>ws.send(JSON.stringify({type:'getState'}));
ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='state'){render(m.state)}if(m.type==='leaderboard'){renderBoard(m.leaderboard)}};
$('start').onclick=()=>ws.send(JSON.stringify({type:'hostStart'}));
$('reset').onclick=()=>{if(confirm('Quiz sıfırlansın?'))ws.send(JSON.stringify({type:'hostReset'}))};
fetch('/api/config').then(r=>r.json()).then(x=>$('url').textContent=x.joinUrl);
function render(s){$('status').textContent=s.phase==='lobby'?'İştirakçıların qoşulması gözlənilir.':s.phase==='question'?`Sual ${s.qIndex+1}/${s.total} aktivdir.`:s.phase==='reveal'?'Düzgün cavab göstərilir...':'Quiz tamamlandı.';renderBoard(s.leaderboard||[])}
function renderBoard(rows){$('board').innerHTML=rows.map((p,i)=>`<div class="row"><div class="rank">#${i+1}</div><div>${p.name}</div><div class="score">${p.score}</div><div class="time">${p.totalTime}s</div></div>`).join('')}
</script></body></html>
